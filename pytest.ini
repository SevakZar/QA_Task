[pytest]
pythonpath = .
testpaths = steps
bdd_features_base_dir = features
addopts = -v --html=reports/report.html --self-contained-html --css=reports/assets/report.css --log-cli-level=INFO
log_cli = true
log_cli_format = %(levelname)s %(name)s %(message)s
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning
